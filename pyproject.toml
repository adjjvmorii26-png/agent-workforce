[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce"
version = "0.1.0"
description = "Central hub: agent workforce + IXPANSION recipe-based experiment platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Workforce Contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
workforce = "workforce.cli:main"

[tool.setuptools.packages.find]
include = ["workforce*", "ixpansion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
