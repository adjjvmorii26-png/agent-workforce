name: auto-evaluate
on:
  push:
    paths: ["ixpansion/**"]
  schedule:
    - cron: "0 2 * * *"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python -m unittest discover -s ixpansion/tests
      - run: python -m ixpansion evaluate "Hub status: 14 agents, X-01..X-04 done, reuse engine live" --mock
      - run: python -m workforce evolve --mock --out /tmp/evolution
